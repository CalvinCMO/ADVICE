{% extends 'layouts/app.html' %}
{% block title %}New Message{% endblock %}
{% block page_title %}New Message{% endblock %}
{% block app_content %}
<div class="max-w-lg"><div class="card">
  <h2 class="font-bold text-gray-900 mb-5">Start a Conversation</h2>
  <form method="post" class="space-y-4">{% csrf_token %}
    <div><label class="block text-sm font-semibold text-gray-700 mb-2">Send to</label>
    <select name="recipient_id" class="form-input" required>
      <option value="">— Select a person —</option>
      {% for u in users %}<option value="{{ u.id }}">{{ u.full_name }} ({{ u.get_role_display }})</option>{% endfor %}
    </select></div>
    <div><label class="block text-sm font-semibold text-gray-700 mb-2">Message</label>
    <textarea name="content" rows="4" class="form-input" placeholder="Write your message..."></textarea></div>
    <div class="flex gap-3">
      <button type="submit" class="btn-primary flex-1">Send Message</button>
      <a href="{% url 'conversations' %}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</div></div>
{% endblock %}
