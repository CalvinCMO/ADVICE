{% extends 'layouts/public.html' %}{% block title %}Contact — ADVICE{% endblock %}
{% block pub_content %}
<div class="max-w-xl mx-auto py-16 px-6">
  <h1 class="text-4xl font-extrabold text-gray-900 mb-3">Get in Touch</h1>
  <p class="text-gray-500 mb-8">Questions about ADVICE? We'd love to hear from you.</p>
  <div class="card">
    <form method="post" class="space-y-4">{% csrf_token %}
      <div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Name</label><input type="text" name="name" class="form-input" placeholder="Your name" required></div>
      <div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Email</label><input type="email" name="email" class="form-input" placeholder="your@email.com" required></div>
      <div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Subject</label><input type="text" name="subject" class="form-input" placeholder="How can we help?" required></div>
      <div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Message</label><textarea name="message" rows="5" class="form-input" placeholder="Your message..." required></textarea></div>
      <button type="submit" class="btn-primary w-full">Send Message</button>
    </form>
  </div>
  <div class="mt-8 text-center text-gray-400 text-sm">Or email us at <a href="mailto:support@advice.com" class="text-blue-600">support@advice.com</a></div>
</div>
{% endblock %}
