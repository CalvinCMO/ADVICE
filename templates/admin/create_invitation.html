{% extends 'layouts/app.html' %}{% block title %}Create Invitation{% endblock %}{% block page_title %}Send Invitation{% endblock %}
{% block app_content %}<div class="max-w-md"><div class="card"><form method="post" class="space-y-5">{% csrf_token %}
<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Email Address</label><input type="email" name="email" class="form-input" placeholder="invitee@university.edu" required></div>
<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Role</label><select name="role" class="form-input">{% for val, label in roles %}<option value="{{ val }}">{{ label }}</option>{% endfor %}</select></div>
<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Expires in (days)</label><select name="days" class="form-input"><option value="3">3 days</option><option value="7" selected>7 days</option><option value="14">14 days</option><option value="30">30 days</option></select></div>
<div class="flex gap-3"><button type="submit" class="btn-primary flex-1">Send Invitation</button><a href="{% url 'manage_invitations' %}" class="btn-secondary">Cancel</a></div>
</form></div></div>{% endblock %}
