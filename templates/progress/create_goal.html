{% extends 'layouts/app.html' %}{% block title %}Create Goal{% endblock %}{% block page_title %}Create New Goal{% endblock %}
{% block app_content %}<div class="max-w-xl"><div class="card"><form method="post" class="space-y-5">{% csrf_token %}
{% if students %}<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Student</label><select name="student_id" class="form-input" required><option value="">Select student</option>{% for s in students %}<option value="{{ s.id }}">{{ s.full_name }}</option>{% endfor %}</select></div>{% else %}<input type="hidden" name="student_id" value="{{ request.user.id }}">{% endif %}
<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Goal Title</label><input type="text" name="title" class="form-input" placeholder="e.g. Reduce anxiety in social situations" required></div>
<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Category</label><select name="category" class="form-input">{% for val, label in categories %}<option value="{{ val }}">{{ label }}</option>{% endfor %}</select></div>
<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Description</label><textarea name="description" rows="4" class="form-input" required></textarea></div>
<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Target Date (optional)</label><input type="date" name="target_date" class="form-input"></div>
<div class="flex gap-3"><button type="submit" class="btn-primary flex-1">Create Goal</button><a href="{% url 'goals' %}" class="btn-secondary">Cancel</a></div>
</form></div></div>{% endblock %}
