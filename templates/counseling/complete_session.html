{% extends 'layouts/app.html' %}{% block title %}Complete Session{% endblock %}{% block page_title %}Complete Session{% endblock %}
{% block app_content %}
<div class="max-w-2xl"><div class="card">
  <h2 class="font-bold text-xl mb-2">Session with {{ session.student.full_name }}</h2>
  <p class="text-gray-500 text-sm mb-6">{{ session.scheduled_at|date:"d M Y, H:i" }}</p>
  <form method="post" class="space-y-5">{% csrf_token %}
    <div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Session Summary (shared with student)</label>
    <textarea name="summary" rows="4" class="form-input" placeholder="Brief summary of what was discussed..."></textarea></div>
    <div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Private Counselor Notes (confidential)</label>
    <textarea name="counselor_notes" rows="4" class="form-input" placeholder="Your private clinical notes..."></textarea></div>
    <div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Student's Mood After Session (1–10)</label>
    <input type="range" name="student_mood_after" min="1" max="10" value="6" class="w-full accent-blue-600" oninput="this.nextElementSibling.textContent=this.value"><span class="text-blue-600 font-semibold">6</span></div>
    <div class="flex items-center gap-3"><input type="checkbox" name="follow_up_required" id="fu" class="w-4 h-4 accent-blue-600"><label for="fu" class="text-sm font-medium text-gray-700">Follow-up required</label></div>
    <div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Follow-up Notes</label>
    <textarea name="follow_up_notes" rows="2" class="form-input" placeholder="Notes for the follow-up..."></textarea></div>
    <div class="flex gap-3"><button type="submit" class="btn-primary flex-1">✓ Complete Session</button><a href="{% url 'session_detail' session.id %}" class="btn-secondary">Cancel</a></div>
  </form>
</div></div>
{% endblock %}
