{% extends 'layouts/app.html' %}{% block title %}Reschedule Session{% endblock %}{% block page_title %}Reschedule Session{% endblock %}
{% block app_content %}<div class="max-w-md"><div class="card">
<p class="text-gray-500 mb-5">Current: {{ session.scheduled_at|date:"d M Y, H:i" }}</p>
<form method="post" class="space-y-4">{% csrf_token %}
<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">New Date & Time</label><input type="datetime-local" name="new_datetime" class="form-input" required></div>
<div class="flex gap-3"><button type="submit" class="btn-primary">Reschedule</button><a href="{% url 'session_detail' session.id %}" class="btn-secondary">Cancel</a></div>
</form></div></div>{% endblock %}
