{% extends 'layouts/app.html' %}
{% block title %}Book a Session — ADVICE{% endblock %}
{% block page_title %}Book a Counseling Session{% endblock %}
{% block page_subtitle %}Schedule time with a counselor{% endblock %}

{% block app_content %}
<div class="max-w-2xl">
  <div class="card">
    <form method="post" class="space-y-6">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Select Counselor</label>
        <select name="counselor_id" class="form-input" required>
          <option value="">— Choose a counselor —</option>
          {% for c in counselors %}
          <option value="{{ c.id }}" {% if request.GET.counselor == c.id|stringformat:"s" %}selected{% endif %}>
            {{ c.full_name }} {% if c.specializations %}— {{ c.specializations|join:", "|truncatechars:40 }}{% endif %}
          </option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Date & Time</label>
        <input type="datetime-local" name="scheduled_at" class="form-input" required min="{{ now|date:'Y-m-d' }}T08:00">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Session Type</label>
          <select name="session_type" class="form-input">
            <option value="individual">Individual</option>
            <option value="crisis">Crisis Intervention</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Mode</label>
          <select name="mode" class="form-input">
            <option value="online">Online (Video/Chat)</option>
            <option value="in_person">In Person</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Duration</label>
        <select name="duration" class="form-input">
          <option value="30">30 minutes</option>
          <option value="45">45 minutes</option>
          <option value="60" selected>60 minutes</option>
          <option value="90">90 minutes</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">How are you feeling right now? (1–10)</label>
        <input type="range" name="mood_before" min="1" max="10" value="5" class="w-full accent-blue-600" oninput="this.nextElementSibling.textContent=this.value">
        <span class="text-sm text-blue-600 font-semibold">5</span>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Reason for Session <span class="text-red-500">*</span></label>
        <textarea name="reason" rows="4" class="form-input" placeholder="Briefly describe what you'd like to discuss or work on..." required></textarea>
      </div>

      <div class="flex gap-3">
        <button type="submit" class="btn-primary flex-1">Book Session</button>
        <a href="{% url 'student_dashboard' %}" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
