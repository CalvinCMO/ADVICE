{% extends 'layouts/public.html' %}{% block title %}Reset Password{% endblock %}
{% block pub_content %}<section class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center py-12 px-4"><div class="w-full max-w-md"><div class="bg-white rounded-3xl shadow-xl p-8">
<h1 class="text-2xl font-bold text-center mb-2">Reset your password</h1><p class="text-gray-400 text-sm text-center mb-6">Enter your email and we'll send you a reset link.</p>
<form method="post" class="space-y-4">{% csrf_token %}
<div>{{ form.email }}</div>
<button type="submit" class="w-full btn-primary py-3.5">Send Reset Link</button>
</form>
<p class="text-center text-sm text-gray-500 mt-4"><a href="{% url 'login' %}" class="text-blue-600 hover:underline">← Back to login</a></p>
</div></div></section>{% endblock %}
