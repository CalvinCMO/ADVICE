{% extends 'layouts/public.html' %}{% block title %}Set New Password{% endblock %}
{% block pub_content %}<section class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center py-12 px-4"><div class="w-full max-w-md"><div class="bg-white rounded-3xl shadow-xl p-8">
<h1 class="text-2xl font-bold text-center mb-6">Set New Password</h1>
<form method="post" class="space-y-4">{% csrf_token %}
<div>{{ form.password1 }}</div><div>{{ form.password2 }}</div>
<button type="submit" class="w-full btn-primary py-3.5">Set Password</button>
</form></div></div></section>{% endblock %}
