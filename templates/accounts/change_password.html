{% extends 'layouts/app.html' %}{% block title %}Change Password{% endblock %}{% block page_title %}Change Password{% endblock %}
{% block app_content %}<div class="max-w-md"><div class="card"><form method="post" class="space-y-5">{% csrf_token %}
<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Current Password</label><input type="password" name="old_password" class="form-input" required></div>
<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">New Password</label><input type="password" name="new_password1" class="form-input" required></div>
<div><label class="block text-sm font-semibold text-gray-700 mb-1.5">Confirm New Password</label><input type="password" name="new_password2" class="form-input" required></div>
<div class="flex gap-3"><button type="submit" class="btn-primary">Update Password</button><a href="{% url 'profile' %}" class="btn-secondary">Cancel</a></div>
</form></div></div>{% endblock %}
